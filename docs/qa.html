<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Last Signal renderer QA</title><style>*{box-sizing:border-box}body{margin:0;background:#889a9f;color:#071b24;font:12px Arial}header{padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{font:12px Arial;padding:7px}main{overflow:auto;padding-bottom:20px}iframe{display:block;max-width:none;margin:auto;border:0;background:#0c1d28}output{padding:8px;display:block;white-space:pre-wrap;background:#eef0e5}</style></head><body><header><strong>LAST SIGNAL / QA</strong><label>Viewport <select id="width"><option value="320">320×740</option><option value="390" selected>390×844</option><option value="768">768×1024</option><option value="1440">1440×1000</option></select></label><label>Text <select id="text"><option value="100">100%</option><option value="200">200%</option></select></label><label>Route <select id="route"><option value="">Story</option><option value="read.html">Reader</option><option value="notes.html">Notes</option></select></label><label>Jump <select id="chapter"><option value="departure">01 Platform</option><option value="window">02 Window</option><option value="tunnel">03 Tunnel</option><option value="arrival">04 Arrival</option><option value="receiver">05 Receiver</option><option value="sky">06 Dome</option><option value="dawn">07 Dawn</option><option value="ending">Ending</option></select></label><label>Progress <select id="progress"><option value="0">0</option><option value=".32">.32</option><option value=".56">.56</option><option value=".82">.82</option></select></label><button id="inspect">Inspect</button></header><main><iframe id="viewport" title="Actual Last Signal page" src="./?qa=22d786064dda" width="390" height="844"></iframe></main><output id="result">Actual same-origin iframe. Set size, chapter, progress, then inspect.</output><script>const f=document.querySelector('#viewport'),width=document.querySelector('#width'),route=document.querySelector('#route'),text=document.querySelector('#text'),chapter=document.querySelector('#chapter'),progress=document.querySelector('#progress'),result=document.querySelector('#result');function setSize(){f.width=width.value;f.height=({320:740,390:844,768:1024,1440:1000})[width.value];f.closest('main').style.minWidth=Number(width.value)>innerWidth?width.value+'px':'0'}width.onchange=setSize;route.onchange=()=>f.src='./'+route.value+'?qa=22d786064dda';function setText(){const d=f.contentDocument;if(d){d.documentElement.style.fontSize=text.value+'%';f.contentWindow.dispatchEvent(new Event('resize'))}}text.onchange=setText;f.onload=setText;function jump(){const d=f.contentDocument,w=f.contentWindow,e=d.getElementById(chapter.value);if(e){w.scrollTo({top:e.getBoundingClientRect().top+w.scrollY+Math.max(0,e.offsetHeight-w.innerHeight)*Number(progress.value),behavior:'instant'})}}chapter.onchange=jump;progress.onchange=jump;document.querySelector('#inspect').onclick=()=>{const d=f.contentDocument,w=f.contentWindow;const broken=[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.currentSrc);const visible=[...d.querySelectorAll('a,button')].map(e=>{const r=e.getBoundingClientRect(),style=w.getComputedStyle(e),modal=d.querySelector('dialog[open]');if(style.visibility!=='hidden'&&!e.closest('[inert]')&&(!modal||modal.contains(e))&&r.width&&r.height&&r.top>=0&&r.bottom<=w.innerHeight&&r.left>=0&&r.right<=w.innerWidth){const target=d.elementFromPoint(r.x+r.width/2,r.y+r.height/2);return{label:e.textContent.trim().slice(0,45)||e.getAttribute('aria-label'),hit:e===target||e.contains(target)}}}).filter(Boolean);result.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,brokenImages:broken,state:w.__lastSignal?.getState(),visibleControls:visible},null,2)};</script></body></html>
